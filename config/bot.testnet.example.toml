# TESTNET(바이낸스 모의 환경 = 데모 트레이딩) 설정 견본 — 테스트넷 서버(staging)에서 config/bot.toml로 복사한다.
# 프로세스 A(서비스 bot: 신호·텔레그램)와 프로세스 B(서비스 orders: 주문)가 **같은 파일**을 읽는다.
# 비밀 값은 쓰지 않는다(파일 경로만). 모르는 키·느슨한 값이 있으면 둘 다 시작을 거부한다. live 모드는 없다.
# 절차: docs/RUNBOOK.md '테스트넷(TESTNET) 절차'.
mode = "testnet"
db_path = "/data/testnet.sqlite3"     # paper DB와 다른 파일(모드가 다르면 DB가 열리지 않는다)
strategy_key = "E0-L-ENS"

[telegram]
enabled = true
allowed_user_id = 0          # 내 텔레그램 사용자 ID(숫자)
allowed_chat_id = 0          # 봇과의 개인 채팅 ID(숫자)
bot_token_file = "/run/secrets/telegram_bot_token"

[claude]
enabled = true
api_key_file = "/run/secrets/anthropic_api_key"

[health]
ping_url_file = ""

# 주문 프로세스(B) 설정 — 조이는 방향만 허용(코드 상한: 레버리지 3, 1회 위험 0.5%, 명목 10,000 USDT, 0.2 BTC)
[orders]
env = "demo"                 # K3: demo = https://demo-fapi.binance.com (호스트는 코드 상수표, 설정에서 받지 않음)
api_key_file = "/run/secrets/binance_api_key"                     # API 키 ID(Ed25519 키 등록 뒤 받은 값)
private_key_file = "/run/secrets/binance_ed25519_private_key"     # Ed25519 개인키 PEM(PKCS#8)
control_file = "/control/orders_control.toml"                     # 서버 전용 제어 파일(정지·T0 해제)
ledger_file = "/state/orders_ledger.json"                         # B 전용 원장(B만 마운트하는 볼륨 ordersstate — T0·누적 한도)
r_capital_usdt = 1000.0      # R 자본(데모 잔고에 맞춰 사람이 정한다)
risk_fraction = 0.005        # 1회 위험(≤ 0.005, 백테스트와 같음)
max_notional_usdt = 1000.0   # 1회 명목 상한(≤ 10,000)
expected_leverage = 3        # 거래소 웹에서 BTCUSDT 레버리지를 이 값으로 맞춰 둔다(봇은 바꾸지 않는다)
ioc_cap_bps = 10             # IOC 상한 지정가 폭 0.10% (≤ 30)
conditional_api = "algo"     # K2: 손절 창구. PoC에서 옛 창구가 정상일 때만 "legacy"
stop_placement = "post_fill" # K1: PoC에서 선배치가 확인될 때만 "pre_entry"
reconcile_interval_s = 10     # 거래소 ↔ DB 대조 주기(5~30초). HALTED·손절 누락은 매 바퀴 따로 본다(V-2)
loop_interval_s = 2.0
