# 과거 재생(replay) 설정 견본 — config/replay.toml로 복사. 비밀 파일을 읽지 않고 외부 연결도 없다.
# 모든 신호를 '판단 + 30분'에 자동 승인·확인한다(백테스트 L=30분과 같은 조건 → 거래가 백테스트와 일치해야 한다).
mode = "replay"
db_path = "/data/replay.sqlite3"

[telegram]
enabled = false

[claude]
enabled = false

[marketdata]
data_dir = "/replay-data"    # 컨테이너 안 경로(docker-compose의 replay 서비스). 로컬 실행이면 "data/binance"

[replay]
start = "2020-01-01"         # 판단 날짜(UTC) 시작. 첫 일봉 다음 날부터 가능
end = "2026-09-29"           # 판단 날짜(UTC) 끝(포함). 2026-09-29 판단 = 2026-09-28 일봉
auto_approve_latency_min = 30
