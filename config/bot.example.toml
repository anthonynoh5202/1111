# 운영(paper) 설정 견본 — config/bot.toml로 복사해서 숫자 ID 두 개만 채운다. bot.toml은 git에 올리지 않는다.
# 비밀 값(토큰·키·핑 URL)은 이 파일에 쓰지 않는다: 파일 경로만 적는다(/run/secrets/...).
# 모르는 키가 있으면 봇이 시작을 거부한다(오타 방지). 전략 숫자(20·55·100일, 2×ATR20, 비용)는 설정이 아니다.
mode = "paper"
db_path = "/data/bot.sqlite3"
strategy_key = "E0-L-ENS"

[telegram]
enabled = true
allowed_user_id = 0          # 내 텔레그램 사용자 ID(숫자, 따옴표 없이). RUNBOOK 2-3 참고
allowed_chat_id = 0          # 봇과의 개인 채팅 ID(숫자, 보통 사용자 ID와 같다). 그룹(음수)은 거부됨
bot_token_file = "/run/secrets/telegram_bot_token"

[claude]
enabled = true
api_key_file = "/run/secrets/anthropic_api_key"
# model·effort·timeout_s는 기본값 고정(claude-opus-5-5, medium, 120초)

[paper]
equity_usdt = 10000.0        # 모의 자본(보고용 크기 계산). 판정은 R 단위

[health]
ping_url_file = ""           # 헬스체크를 쓰면 "/run/secrets/healthcheck_ping_url"
