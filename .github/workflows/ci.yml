name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (PV-25: 커밋 SHA 고정)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: 의존성 설치(버전 고정)
        run: python -m pip install --no-cache-dir --require-hashes -r requirements-dev.txt
      - name: 테스트(빠른 것 전체)
        run: python -m pytest backtest/tests bot/tests -m "not slow" -q
      - name: 대조 시험(실데이터 재생 == 백테스트 E0-L-ENS 거래)
        run: python -m pytest bot/tests/test_parity.py bot/tests/test_main.py -m slow -q
      - name: 배포 파일 규칙(ports 없음, 환경 변수에 비밀 이름 없음)
        run: |
          if grep -nE '^\s*ports\s*:' docker-compose.yml; then echo "docker-compose.yml에 ports: 금지"; exit 1; fi
          if grep -nEi '(TOKEN|API_KEY|SECRET|PASSWORD)\s*[:=]\s*\S' docker-compose.yml .env.example; then
            echo "비밀로 보이는 값이 배포 파일에 있다"; exit 1; fi

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (PV-25: 커밋 SHA 고정)
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks(전체 이력)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose --exit-code 1
