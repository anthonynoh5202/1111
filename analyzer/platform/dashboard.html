<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>차트분석기 자동 분석</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* 배치: 상태 줄 → 주의 → 판정 세 칸 → Claude 해설 → 분석기 화면(차트와 근거) → 기록 표 */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#161b25; --muted:#5a6475; --line:#dde2ea; --soft:#eef1f6;
  --up:#d2343c; --down:#2460c4; --accent:#0d766d; --warn:#a95a08;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#10131a; --surface:#181c25; --fg:#e6e9ef; --muted:#97a1b2; --line:#2a303c; --soft:#20252f;
  --up:#f0626b; --down:#6098f2; --accent:#42bbae; --warn:#e2a34a; color-scheme:dark } }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;font-weight:700;margin:0} h2{font-size:16px;font-weight:600;margin:0 0 8px}
p{margin:0} .muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
button{font:inherit;color:var(--surface);background:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.stat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12.5px;color:var(--muted)} .stat .v{font-weight:600;overflow-wrap:anywhere}
.banner{border:1px solid var(--warn);border-radius:10px;padding:10px 14px;background:var(--surface);font-size:14px}
.banner ul{margin:0;padding-left:18px}
.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .q{font-size:12.5px;color:var(--muted)} .tile .a{font-size:21px;font-weight:700}
#cmt{white-space:pre-wrap;font-size:14.5px;max-width:72ch}
iframe{width:100%;height:900px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:12.5px}
@media (max-width:760px){ .stat{grid-template-columns:repeat(2,minmax(0,1fr))} .verdict{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>차트분석기 자동 분석</h1>
      <span class="small muted">BTCUSDT 무기한 선물 · 4시간봉이 마감될 때마다 · 읽기 전용, 주문 기능 없음</span>
    </div>
    <div><button id="run" type="button">지금 분석</button> <span class="small muted" id="runMsg" role="status"></span></div>
  </header>

  <section class="panel stat" aria-label="상태">
    <div><span class="k">다음 자동 분석</span><span class="v num" id="next">–</span></div>
    <div><span class="k">마지막 실행</span><span class="v" id="last">–</span></div>
    <div><span class="k">쓴 자료</span><span class="v" id="src">–</span></div>
  </section>

  <div class="banner" id="banner" hidden><ul id="notes"></ul></div>

  <section class="verdict" aria-label="판정">
    <div class="tile"><span class="q">방향</span><span class="a" id="vDir">–</span><span class="small muted" id="vBar"></span></div>
    <div class="tile"><span class="q">크기 · 다음 16시간</span><span class="a" id="vSize">–</span><span class="small muted num" id="vBand"></span></div>
    <div class="tile"><span class="q">신호 · 거래량 터진 윗꼬리</span><span class="a" id="vSig">–</span><span class="small muted" id="vSigWhy"></span></div>
  </section>

  <section class="panel">
    <h2>Claude 해설</h2>
    <p id="cmt" class="muted">아직 없습니다.</p>
    <p class="small muted" id="cmtMeta" style="margin-top:10px"></p>
  </section>

  <section>
    <iframe id="chart" src="/chart" title="분석기 화면"></iframe>
  </section>

  <section class="panel">
    <h2>기록 (마감 봉마다 하나)</h2>
    <p class="small muted" style="margin-bottom:8px">16시간 뒤 결과는 그 뒤의 봉을 읽은 다음에 채워집니다. 롱 신호가 진짜인지는 이 기록이 1년쯤 쌓여야 가릴 수 있습니다.</p>
    <div class="tablewrap"><table>
      <thead><tr><th>봉 마감</th><th>신호</th><th>신호값</th><th>크기</th><th>종가</th><th>16시간 뒤</th><th>자료</th></tr></thead>
      <tbody id="hist"></tbody>
    </table></div>
  </section>
</div>

<script>
(function(){
"use strict";
const TOKEN="__TOKEN__";
const $=id=>document.getElementById(id);
const el=(tag,text,cls)=>{const e=document.createElement(tag); if(text!=null) e.textContent=text; if(cls) e.className=cls; return e;};
const fmt=(x,d=0)=>Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const SRC={binance:"바이낸스"};
let shown=null;

function render(s){
  $("next").textContent=s.next_run_kst?s.next_run_kst+" KST":"–";
  const lr=s.last_run;
  $("last").textContent=lr?lr.run_at_kst+" · "+(lr.ok?"성공":"실패")+" ("+lr.trigger+")":"아직 없음";
  $("run").disabled=s.running; if(s.running) $("runMsg").textContent="분석하는 중…";
  const L=s.latest, notes=[];
  if(lr&&!lr.ok&&lr.error) notes.push(lr.error);
  if(lr) (lr.notes||[]).forEach(n=>notes.push(n));
  if(L) (L.result.warnings||[]).forEach(n=>notes.push(n));
  $("banner").hidden=!notes.length; $("notes").replaceChildren(...notes.map(n=>el("li",n)));
  if(!L){ $("src").textContent="–"; return; }
  const v=L.result.verdict;
  $("src").textContent=(SRC[L.source_used]||L.source_used)+" · 봉 "+L.result.source.bars_used+"개";
  $("vDir").textContent=v.direction; $("vBar").textContent=L.result.source.last_closed_bar_kst+" KST 마감 봉 기준";
  $("vSize").textContent=v.size_state+" · 보통 ±"+v.typical_move_pct.toFixed(2)+"%";
  $("vBand").textContent="5번 중 4번은 "+fmt(v.band_16h[0])+" ~ "+fmt(v.band_16h[1]);
  $("vSig").textContent=v.signal; $("vSig").className="a"+(v.signal==="롱"?" up":"");
  $("vSigWhy").textContent=(v.signal_value!=null?"값 "+v.signal_value.toFixed(3)+" · 롱 기준 0.422 이상":"")+(v.signal==="롱"?(v.is_9pm_bar?" · 밤 9시 봉":" · 밤 9시 봉이 아니라 기록만"):"");
  const c=L.commentary||{};
  $("cmt").textContent=c.text||(c.error?c.error:(c.skipped?"꺼져 있습니다. 설정 파일에서 commentary.enabled 를 true 로 바꾸고 ANTHROPIC_API_KEY 를 넣으면 켜집니다.":"아직 없습니다."));
  $("cmt").className=c.text?"":"muted";
  $("cmtMeta").textContent=c.text?"판정은 고정된 계산이 냈고, 해설은 그것을 풀어 쓴 글입니다. 모델 "+c.model+(c.usage?" · 입력 "+fmt(c.usage.input_tokens)+" / 출력 "+fmt(c.usage.output_tokens)+" 토큰":""):"";
  $("hist").replaceChildren(...(s.history.length?s.history.map(h=>{
    const tr=document.createElement("tr");
    tr.append(el("td",h.bar_close_kst+(h.is_9pm_bar?" ★":""),"num"), el("td",h.signal,h.signal==="롱"?"up":""), el("td",h.signal_value!=null?h.signal_value.toFixed(3):"–","num"),
      el("td",h.size_state), el("td",fmt(h.close,1),"num"),
      el("td",h.after_16h_pct==null?"–":(h.after_16h_pct>=0?"+":"")+h.after_16h_pct.toFixed(2)+"%","num "+(h.after_16h_pct==null?"":(h.after_16h_pct>=0?"up":"down"))),
      el("td",SRC[h.source]||h.source));
    return tr;}):[(()=>{const tr=document.createElement("tr"); const td=el("td","아직 기록이 없습니다"); td.colSpan=7; tr.append(td); return tr;})()]));
  if(shown!==L.run_at_kst){ shown=L.run_at_kst; $("chart").src="/chart?t="+encodeURIComponent(L.run_at_kst); }
}
async function refresh(){
  try{ const r=await fetch("/api/status",{cache:"no-store"}); if(r.ok) render(await r.json()); }
  catch(e){ $("runMsg").textContent="플랫폼이 꺼져 있는 것 같습니다."; }
}
$("run").addEventListener("click",async()=>{
  $("run").disabled=true; $("runMsg").textContent="분석하는 중…";
  try{ const r=await fetch("/api/run",{method:"POST",headers:{"X-Token":TOKEN}}); const j=await r.json(); $("runMsg").textContent=j.message; }
  catch(e){ $("runMsg").textContent="요청하지 못했습니다."; }
  await refresh();
});
$("chart").addEventListener("load",()=>{ try{ const d=$("chart").contentDocument; if(d&&d.body) $("chart").style.height=Math.max(600,d.documentElement.scrollHeight+8)+"px"; }catch(e){} });
refresh(); setInterval(refresh,30000);
})();
</script>
</body>
</html>
